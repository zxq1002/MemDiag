server.port=8080
spring.application.name=memdiag-web

# CORS configuration
memdiag.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
memdiag.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
memdiag.cors.allowed-headers=*
memdiag.cors.allow-credentials=true

# Logging
logging.level.com.memdiag=INFO
