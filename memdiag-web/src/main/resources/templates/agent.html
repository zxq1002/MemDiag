<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName">-</span>
                            </div>
                            <div class="ms-auto">
                                <button class="btn btn-primary" id="refreshBtn">
                                    <i class="bi bi-arrow-repeat"></i> 刷新
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="bi bi-gear"></i>
                        </div>
                        <div class="stat-info">
                            <h4>Agent 状态</h4>
                            <div class="value" id="agentStatus">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="bi bi-plug"></i>
                        </div>
                        <div class="stat-info">
                            <h4>JVMTI</h4>
                            <div class="value" id="jvmtiStatus">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="bi bi-pencil"></i>
                        </div>
                        <div class="stat-info">
                            <h4>字节码插桩</h4>
                            <div class="value" id="instrumentStatus">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon info">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <div class="stat-info">
                            <h4>转换类数</h4>
                            <div class="value" id="transformedCount">-</div>
                        </div>
                    </div>
                </div>

                <div class="row" style="margin-bottom: 20px;">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="bi bi-sliders"></i> Agent 配置</h3>
                            </div>
                            <div class="card-body" id="configContainer">
                                <div class="loading" style="padding: 20px;">
                                    <div class="spinner"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h3><i class="bi bi-speedometer2"></i> Agent 指标</h3>
                            </div>
                            <div class="card-body" id="metricsContainer">
                                <div class="loading" style="padding: 20px;">
                                    <div class="spinner"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-layers"></i> 插桩控制</h3>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="allocationToggle">
                                    <label class="form-check-label" for="allocationToggle">分配追踪</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="methodToggle">
                                    <label class="form-check-label" for="methodToggle">方法监控</label>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-outline" id="saveConfigBtn">
                                <i class="bi bi-save"></i> 保存配置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:fragment="scripts">
        // Use the global connectionId from layout
        let connectionId = currentConnectionId;

        document.addEventListener('DOMContentLoaded', function() {
            // Only set connectionName if connectionId is already available
            // Otherwise, layout.html's loadConnections() will set it after fetching connections
            if (connectionId) {
                document.getElementById('connectionName').textContent = connectionId;
            }
            document.getElementById('refreshBtn').addEventListener('click', loadAgentStatus);
            document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
            loadAgentStatus();
        });

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function loadAgentStatus() {
            Promise.all([
                fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/agent/status`).then(r => r.json()),
                fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/agent/config`).then(r => r.json()),
                fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/agent/metrics`).then(r => r.json())
            ])
            .then(([status, config, metrics]) => {
                if (status.success) renderStatus(status.data);
                if (config.success) renderConfig(config.data);
                if (metrics.success) renderMetrics(metrics.data);
            })
            .catch(err => {
                console.error('Failed to load agent status:', err);
                showFallback();
            });
        }

        function renderStatus(data) {
            document.getElementById('agentStatus').innerHTML =
                data.running ? '<span style="color: #198754;">运行中</span>' : '<span style="color: #6c757d;">未运行</span>';
            document.getElementById('jvmtiStatus').innerHTML =
                data.jvmtiEnabled ? '<span style="color: #198754;">已启用</span>' : '<span style="color: #6c757d;">未启用</span>';
            document.getElementById('instrumentStatus').innerHTML =
                data.instrumentEnabled ? '<span style="color: #198754;">已启用</span>' : '<span style="color: #6c757d;">未启用</span>';
            document.getElementById('transformedCount').textContent = formatNumber(data.transformedClasses || 0);

            document.getElementById('allocationToggle').checked = data.allocationEnabled || false;
            document.getElementById('methodToggle').checked = data.methodMonitorEnabled || false;
        }

        function renderConfig(data) {
            const container = document.getElementById('configContainer');
            const configs = Object.entries(data || {});

            if (configs.length === 0) {
                container.innerHTML = '<div class="alert alert-info" style="margin: 0;">暂无配置数据</div>';
                return;
            }

            let html = '<table class="table" style="margin: 0;">';
            html += '<thead><tr><th>配置项</th><th>值</th></tr></thead>';
            html += '<tbody>';
            configs.forEach(([k, v]) => {
                html += `<tr><td><code>${escapeHtml(k)}</code></td><td>${escapeHtml(String(v))}</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderMetrics(data) {
            const container = document.getElementById('metricsContainer');
            const metrics = Object.entries(data || {});

            if (metrics.length === 0) {
                container.innerHTML = '<div class="alert alert-info" style="margin: 0;">暂无指标数据</div>';
                return;
            }

            let html = '<table class="table" style="margin: 0;">';
            html += '<thead><tr><th>指标</th><th>值</th></tr></thead>';
            html += '<tbody>';
            metrics.forEach(([k, v]) => {
                html += `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(String(v))}</td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function saveConfig() {
            const config = {
                allocationEnabled: document.getElementById('allocationToggle').checked,
                methodMonitorEnabled: document.getElementById('methodToggle').checked
            };

            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/agent/config`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('配置已保存');
                } else {
                    alert('保存失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(err => {
                alert('保存失败: ' + err.message);
            });
        }

        function showFallback() {
            document.getElementById('agentStatus').innerHTML = '<span style="color: #6c757d;">-</span>';
            document.getElementById('jvmtiStatus').innerHTML = '<span style="color: #6c757d;">-</span>';
            document.getElementById('instrumentStatus').innerHTML = '<span style="color: #6c757d;">-</span>';
            document.getElementById('transformedCount').textContent = '-';

            document.getElementById('configContainer').innerHTML = `
                <div class="alert alert-info" style="margin: 0;">
                    <i class="bi bi-info-circle"></i> 请通过 Agent 模式连接以获取 Agent 状态
                </div>
            `;
            document.getElementById('metricsContainer').innerHTML = `
                <div class="alert alert-info" style="margin: 0;">
                    <i class="bi bi-info-circle"></i> 请通过 Agent 模式连接以获取指标
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
