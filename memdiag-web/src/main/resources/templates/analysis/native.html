<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName" th:text="${connectionId}">-</span>
                            </div>
                            <div class="ms-auto">
                                <button class="btn btn-primary" id="refreshBtn">
                                    <i class="bi bi-arrow-repeat"></i> 刷新
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i>
                    堆外内存分析功能需要 Agent 模式和 JVMTI 支持。
                </div>

                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="bi bi-cpu"></i>
                        </div>
                        <div class="stat-info">
                            <h4>总堆外大小</h4>
                            <div class="value" id="totalNativeSize">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <div class="stat-info">
                            <h4>内存区域数</h4>
                            <div class="value" id="regionCount">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>疑似泄漏</h4>
                            <div class="value" id="leakCount">-</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-list-ul"></i> 内存区域</h3>
                    </div>
                    <div class="card-body" id="nativeContainer">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> 请先通过 Agent 模式连接目标 JVM
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:inline="javascript" th:fragment="scripts">
        // Get connectionId directly from template
        let connectionId = /*[[${connectionId}]]*/ null;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('refreshBtn').addEventListener('click', loadNativeData);
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function loadNativeData() {
            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/native/summary`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderNativeData(data.data);
                    } else {
                        showError(data.error || '加载失败');
                    }
                })
                .catch(err => {
                    showError('加载失败: ' + err.message);
                });
        }

        function renderNativeData(data) {
            document.getElementById('totalNativeSize').textContent = formatBytes(data.totalSize || 0);
            document.getElementById('regionCount').textContent = (data.regions || []).length;
            document.getElementById('leakCount').textContent = (data.suspectedLeaks || []).length;

            const container = document.getElementById('nativeContainer');
            const regions = data.regions || [];

            if (regions.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info" style="margin: 0;">
                        <i class="bi bi-info-circle"></i> 暂无数据
                    </div>
                `;
                return;
            }

            let html = '<table class="table" style="margin: 0;">';
            html += '<thead><tr><th>地址</th><th>大小</th><th>类型</th><th>权限</th><th>映射文件</th></tr></thead>';
            html += '<tbody>';
            regions.forEach(r => {
                html += '<tr>';
                html += '<td><code>' + (r.address || '-') + '</code></td>';
                html += '<td>' + formatBytes(r.size || 0) + '</td>';
                html += '<td>' + escapeHtml(r.type || '-') + '</td>';
                html += '<td>' + escapeHtml(r.permissions || '-') + '</td>';
                html += '<td>' + escapeHtml(r.mappedFile || '-') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function showError(message) {
            const container = document.getElementById('nativeContainer');
            container.innerHTML = '<div class="alert alert-danger" style="margin: 0;"><i class="bi bi-exclamation-triangle"></i> ' + escapeHtml(message) + '</div>';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
