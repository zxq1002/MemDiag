<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <!-- Connection Info -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName" th:text="${connectionId}">-</span>
                            </div>
                            <div class="ms-auto">
                                <button class="btn btn-primary" id="refreshBtn">
                                    <i class="bi bi-arrow-repeat"></i> 重新诊断
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Stats -->
                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <div class="stat-icon danger">
                            <i class="bi bi-exclamation-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>严重问题</h4>
                            <div class="value" id="criticalCount">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>警告</h4>
                            <div class="value" id="warningCount">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon info">
                            <i class="bi bi-info-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>建议</h4>
                            <div class="value" id="infoCount">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>健康项</h4>
                            <div class="value" id="healthyCount">0</div>
                        </div>
                    </div>
                </div>

                <!-- Health Score -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><i class="bi bi-heart-pulse"></i> 健康评分</h3>
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-4">
                            <div style="flex-shrink: 0;">
                                <svg id="healthGauge" width="150" height="150"></svg>
                            </div>
                            <div>
                                <h2 id="healthScoreText" style="font-size: 3rem; margin: 0;">-</h2>
                                <p id="healthStatusText" style="font-size: 1.25rem; margin: 0;">加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Diagnosis Results -->
                <div class="card" id="diagnosisCard" style="display: none;">
                    <div class="card-header">
                        <h3><i class="bi bi-stethoscope"></i> 诊断结果</h3>
                        <div class="btn-group">
                            <button class="btn btn-outline btn-sm" onclick="filterResults('all')" id="filterAll">全部</button>
                            <button class="btn btn-outline btn-sm" onclick="filterResults('critical')" id="filterCritical">严重</button>
                            <button class="btn btn-outline btn-sm" onclick="filterResults('warning')" id="filterWarning">警告</button>
                            <button class="btn btn-outline btn-sm" onclick="filterResults('info')" id="filterInfo">建议</button>
                        </div>
                    </div>
                    <div class="card-body" id="diagnosisContainer">
                        <div class="loading" style="padding: 40px;">
                            <div class="spinner"></div>
                            <span style="margin-left: 15px;">诊断中...</span>
                        </div>
                    </div>
                </div>

                <!-- Export Section -->
                <div class="card" id="exportCard" style="display: none; margin-top: 20px;">
                    <div class="card-header">
                        <h3><i class="bi bi-file-earmark-arrow-down"></i> 导出报告</h3>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <select class="form-select" id="exportFormat">
                                    <option value="json">JSON 格式</option>
                                    <option value="html">HTML 格式</option>
                                    <option value="text">纯文本格式</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100" id="exportBtn">
                                    <i class="bi bi-download"></i> 下载报告
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:inline="javascript" th:fragment="scripts">
        // Get connectionId directly from template
        let connectionId = /*[[${connectionId}]]*/ null;
        let diagnosisData = null;
        let currentFilter = 'all';

        const severityConfig = {
            critical: { color: '#dc3545', icon: 'bi-exclamation-circle', label: '严重' },
            warning: { color: '#ffc107', icon: 'bi-exclamation-triangle', label: '警告' },
            info: { color: '#0dcaf0', icon: 'bi-info-circle', label: '建议' },
            healthy: { color: '#198754', icon: 'bi-check-circle', label: '健康' }
        };

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('refreshBtn').addEventListener('click', loadDiagnosis);
            document.getElementById('exportBtn').addEventListener('click', exportReport);

            loadDiagnosis();
        });

        function loadDiagnosis() {
            const container = document.getElementById('diagnosisContainer');
            document.getElementById('diagnosisCard').style.display = 'block';
            document.getElementById('exportCard').style.display = 'none';
            container.innerHTML = `
                <div class="loading" style="padding: 40px;">
                    <div class="spinner"></div>
                    <span style="margin-left: 15px;">诊断中...</span>
                </div>
            `;

            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/diagnose`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        diagnosisData = data.data;
                        renderStats(diagnosisData);
                        renderHealthScore(diagnosisData);
                        renderDiagnosis(diagnosisData);
                        document.getElementById('exportCard').style.display = 'block';
                    } else {
                        showError(data.error || '诊断失败');
                    }
                })
                .catch(err => {
                    showError('诊断失败: ' + err.message);
                });
        }

        function renderStats(data) {
            const issues = data.issues || [];
            let critical = 0, warning = 0, info = 0, healthy = 0;

            issues.forEach(issue => {
                const severity = issue.severity || 'info';
                if (severity === 'critical') critical++;
                else if (severity === 'warning') warning++;
                else if (severity === 'info') info++;
            });

            if (data.healthyChecks) {
                healthy = data.healthyChecks.length;
            }

            document.getElementById('criticalCount').textContent = critical;
            document.getElementById('warningCount').textContent = warning;
            document.getElementById('infoCount').textContent = info;
            document.getElementById('healthyCount').textContent = healthy;
        }

        function renderHealthScore(data) {
            const issues = data.issues || [];
            let score = 100;

            issues.forEach(issue => {
                const severity = issue.severity || 'info';
                if (severity === 'critical') score -= 20;
                else if (severity === 'warning') score -= 10;
                else if (severity === 'info') score -= 5;
            });

            score = Math.max(0, score);

            let status, statusColor;
            if (score >= 80) { status = '健康'; statusColor = '#198754'; }
            else if (score >= 60) { status = '基本健康'; statusColor = '#ffc107'; }
            else if (score >= 40) { status = '需要关注'; statusColor = '#fd7e14'; }
            else { status = '严重问题'; statusColor = '#dc3545'; }

            document.getElementById('healthScoreText').textContent = score;
            document.getElementById('healthScoreText').style.color = statusColor;
            document.getElementById('healthStatusText').textContent = status;
            document.getElementById('healthStatusText').style.color = statusColor;

            renderGauge(score, statusColor);
        }

        function renderGauge(score, color) {
            const svg = document.getElementById('healthGauge');
            const radius = 60;
            const cx = 75;
            const cy = 75;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (score / 100) * circumference;

            svg.innerHTML = `
                <circle cx="${cx}" cy="${cy}" r="${radius}"
                    fill="none" stroke="#eee" stroke-width="12"/>
                <circle cx="${cx}" cy="${cy}" r="${radius}"
                    fill="none" stroke="${color}" stroke-width="12"
                    stroke-linecap="round"
                    stroke-dasharray="${circumference} ${circumference}"
                    stroke-dashoffset="${offset}"
                    transform="rotate(-90 ${cx} ${cy})"/>
                <text x="${cx}" y="${cy + 8}" text-anchor="middle"
                    font-size="28" font-weight="bold" fill="${color}">${score}</text>
            `;
        }

        function renderDiagnosis(data) {
            filterResults(currentFilter);
        }

        function filterResults(filter) {
            currentFilter = filter;
            const container = document.getElementById('diagnosisContainer');
            const issues = diagnosisData.issues || [];
            const healthy = diagnosisData.healthyChecks || [];

            // Update filter buttons
            ['All', 'Critical', 'Warning', 'Info'].forEach(f => {
                const btn = document.getElementById('filter' + f);
                if (btn) {
                    btn.classList.toggle('btn-primary', f.toLowerCase() === filter);
                    btn.classList.toggle('btn-outline', f.toLowerCase() !== filter);
                }
            });

            let filtered = [];
            if (filter === 'all') {
                filtered = [...issues, ...healthy.map(h => ({ ...h, severity: 'healthy' }))];
            } else if (filter === 'healthy') {
                filtered = healthy.map(h => ({ ...h, severity: 'healthy' }));
            } else {
                filtered = issues.filter(i => i.severity === filter);
            }

            filtered.sort((a, b) => {
                const order = { critical: 0, warning: 1, info: 2, healthy: 3 };
                return (order[a.severity] || 99) - (order[b.severity] || 99);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info" style="margin: 20px;">
                        <i class="bi bi-info-circle"></i> 没有${filter === 'all' ? '' : filter === 'critical' ? '严重' : filter === 'warning' ? '警告' : '建议'}问题
                    </div>
                `;
                return;
            }

            let html = '<div style="display: grid; gap: 15px;">';
            filtered.forEach(item => {
                const config = severityConfig[item.severity] || severityConfig.info;
                html += `
                    <div class="card" style="margin: 0; border-left: 4px solid ${config.color};">
                        <div class="card-body">
                            <div class="d-flex align-items-start gap-3">
                                <i class="bi ${config.icon}" style="font-size: 1.5rem; color: ${config.color};"></i>
                                <div style="flex: 1;">
                                    <div class="d-flex align-items-center gap-2 mb-2">
                                        <h5 style="margin: 0;">${escapeHtml(item.title || '未知问题')}</h5>
                                        <span class="badge" style="background: ${config.color}20; color: ${config.color};">
                                            ${config.label}
                                        </span>
                                    </div>
                                    <p style="margin: 0 0 10px; color: #666;">${escapeHtml(item.description || '')}</p>
                                    ${item.recommendation ? `
                                        <div style="background: #f8f9fa; padding: 10px 15px; border-radius: 8px;">
                                            <strong><i class="bi bi-lightbulb"></i> 建议:</strong>
                                            <span style="margin-left: 8px;">${escapeHtml(item.recommendation)}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function exportReport() {
            const format = document.getElementById('exportFormat').value;
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const filename = `memdiag-diagnosis-${connectionId}-${timestamp}.${format}`;

            let content, mimeType;
            if (format === 'json') {
                content = JSON.stringify(diagnosisData, null, 2);
                mimeType = 'application/json';
            } else if (format === 'html') {
                content = generateHtmlReport(diagnosisData);
                mimeType = 'text/html';
            } else {
                content = generateTextReport(diagnosisData);
                mimeType = 'text/plain';
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function generateHtmlReport(data) {
            const issues = data.issues || [];
            return `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MemDiag 诊断报告 - ${connectionId}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        h1 { color: #333; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; }
        .issue { margin: 20px 0; padding: 15px; border-radius: 8px; border-left: 4px solid; }
        .critical { background: #fff5f5; border-color: #dc3545; }
        .warning { background: #fffbf0; border-color: #ffc107; }
        .info { background: #f0f9ff; border-color: #0dcaf0; }
        .healthy { background: #f0fff4; border-color: #198754; }
        .meta { color: #666; font-size: 0.9rem; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>MemDiag 诊断报告</h1>
    <p><strong>连接:</strong> ${connectionId}</p>
    <p><strong>时间:</strong> ${new Date().toLocaleString()}</p>
    <h2>发现的问题</h2>
    ${issues.map(i => `
        <div class="issue ${i.severity}">
            <h3>${i.title}</h3>
            <p>${i.description}</p>
            ${i.recommendation ? `<p><strong>建议:</strong> ${i.recommendation}</p>` : ''}
        </div>
    `).join('')}
    <div class="meta">由 MemDiag 生成</div>
</body>
</html>`;
        }

        function generateTextReport(data) {
            const issues = data.issues || [];
            let report = `MemDiag 诊断报告\n`;
            report += `连接: ${connectionId}\n`;
            report += `时间: ${new Date().toLocaleString()}\n`;
            report += `${'='.repeat(60)}\n\n`;
            report += `发现的问题:\n\n`;
            issues.forEach(i => {
                report += `[${i.severity.toUpperCase()}] ${i.title}\n`;
                report += `${i.description}\n`;
                if (i.recommendation) report += `建议: ${i.recommendation}\n`;
                report += '\n';
            });
            return report;
        }

        function showError(message) {
            const container = document.getElementById('diagnosisContainer');
            container.innerHTML = `
                <div class="alert alert-danger" style="margin: 20px;">
                    <i class="bi bi-exclamation-triangle"></i> ${escapeHtml(message)}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
