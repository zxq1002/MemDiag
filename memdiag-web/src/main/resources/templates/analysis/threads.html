<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <!-- Connection Info -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName" th:text="${connectionId}">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" id="searchInput" placeholder="搜索线程名...">
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" id="stateFilter">
                                    <option value="all">所有状态</option>
                                    <option value="RUNNABLE">RUNNABLE</option>
                                    <option value="WAITING">WAITING</option>
                                    <option value="TIMED_WAITING">TIMED_WAITING</option>
                                    <option value="BLOCKED">BLOCKED</option>
                                    <option value="NEW">NEW</option>
                                    <option value="TERMINATED">TERMINATED</option>
                                </select>
                            </div>
                            <div class="col-md-5 d-flex gap-2">
                                <button class="btn btn-primary flex-grow-1" id="refreshBtn">
                                    <i class="bi bi-arrow-repeat"></i> 刷新
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Stats Overview -->
                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="bi bi-collection"></i>
                        </div>
                        <div class="stat-info">
                            <h4>总线程数</h4>
                            <div class="value" id="totalThreads">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="bi bi-play-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>RUNNABLE</h4>
                            <div class="value" id="runnableCount">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="bi bi-pause-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>WAITING</h4>
                            <div class="value" id="waitingCount">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon danger">
                            <i class="bi bi-stop-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h4>BLOCKED</h4>
                            <div class="value" id="blockedCount">0</div>
                        </div>
                    </div>
                </div>

                <!-- Deadlock Alert -->
                <div class="alert alert-danger" id="deadlockAlert" style="display: none; margin-bottom: 20px;">
                    <i class="bi bi-exclamation-triangle"></i>
                    <strong>检测到死锁!</strong>
                    <span id="deadlockDetails"></span>
                </div>

                <!-- State Distribution Chart -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><i class="bi bi-pie-chart"></i> 线程状态分布</h3>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" style="height: 250px;">
                            <canvas id="stateChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Thread List -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-list-ul"></i> 线程列表</h3>
                        <span class="badge badge-info" id="filteredCount">0 条</span>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div id="threadListContainer" style="max-height: 700px; overflow-y: auto;">
                            <div class="loading" style="padding: 40px;">
                                <div class="spinner"></div>
                                <span style="margin-left: 15px;">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Stack Trace Modal -->
    <div class="modal fade" id="stackTraceModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="stackTraceModalTitle">堆栈追踪</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="stackTraceContent" style="background: #f8f9fa; padding: 15px; border-radius: 8px; max-height: 500px; overflow: auto; font-size: 0.85rem;"></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="copyStackTraceBtn">
                        <i class="bi bi-clipboard"></i> 复制
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:inline="javascript" th:fragment="scripts">
        // Get connectionId directly from template
        let connectionId = /*[[${connectionId}]]*/ null;
        let stateChart = null;
        let allThreads = [];

        const stateColors = {
            'RUNNABLE': '#198754',
            'WAITING': '#ffc107',
            'TIMED_WAITING': '#fd7e14',
            'BLOCKED': '#dc3545',
            'NEW': '#6c757d',
            'TERMINATED': '#212529'
        };

        document.addEventListener('DOMContentLoaded', function() {
            // Wait for Chart.js to be available
            if (typeof Chart === 'undefined') {
                const checkChart = setInterval(function() {
                    if (typeof Chart !== 'undefined') {
                        clearInterval(checkChart);
                        initPage();
                    }
                }, 100);
                setTimeout(function() {
                    clearInterval(checkChart);
                    if (typeof Chart === 'undefined') {
                        showError('Chart.js 加载超时，请刷新页面重试');
                    }
                }, 5000);
            } else {
                initPage();
            }
        });

        function initPage() {
            loadThreadData();

            document.getElementById('refreshBtn').addEventListener('click', loadThreadData);
            document.getElementById('searchInput').addEventListener('input', filterThreads);
            document.getElementById('stateFilter').addEventListener('change', filterThreads);

            // Copy stack trace button
            document.getElementById('copyStackTraceBtn').addEventListener('click', function() {
                const content = document.getElementById('stackTraceContent').textContent;
                navigator.clipboard.writeText(content).then(() => {
                    this.innerHTML = '<i class="bi bi-check"></i> 已复制';
                    setTimeout(() => {
                        this.innerHTML = '<i class="bi bi-clipboard"></i> 复制';
                    }, 2000);
                });
            });
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function loadThreadData() {
            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/threads`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        allThreads = data.data.threads || [];
                        renderStats(allThreads);
                        renderChart(allThreads);
                        checkDeadlocks(data.data);
                        filterThreads();
                    } else {
                        showError(data.error || '加载失败');
                    }
                })
                .catch(err => {
                    showError('加载失败: ' + err.message);
                });
        }

        function renderStats(threads) {
            const counts = {
                total: threads.length,
                RUNNABLE: 0,
                WAITING: 0,
                TIMED_WAITING: 0,
                BLOCKED: 0,
                other: 0
            };

            threads.forEach(t => {
                const state = t.state || 'UNKNOWN';
                if (counts.hasOwnProperty(state)) {
                    counts[state]++;
                } else {
                    counts.other++;
                }
            });

            document.getElementById('totalThreads').textContent = formatNumber(counts.total);
            document.getElementById('runnableCount').textContent = formatNumber(counts.RUNNABLE);
            document.getElementById('waitingCount').textContent = formatNumber(counts.WAITING + counts.TIMED_WAITING);
            document.getElementById('blockedCount').textContent = formatNumber(counts.BLOCKED);
        }

        function renderChart(threads) {
            const stateCounts = {};
            threads.forEach(t => {
                const state = t.state || 'UNKNOWN';
                stateCounts[state] = (stateCounts[state] || 0) + 1;
            });

            const ctx = document.getElementById('stateChart').getContext('2d');
            if (stateChart) stateChart.destroy();

            const labels = Object.keys(stateCounts);
            const colors = labels.map(s => stateColors[s] || '#6c757d');

            stateChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: labels.map(l => stateCounts[l]),
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 12,
                                padding: 15
                            }
                        }
                    }
                }
            });
        }

        function checkDeadlocks(data) {
            const alert = document.getElementById('deadlockAlert');
            const details = document.getElementById('deadlockDetails');

            if (data.deadlockedThreads && data.deadlockedThreads.length > 0) {
                alert.style.display = 'block';
                details.textContent = `涉及 ${data.deadlockedThreads.length} 个线程`;
            } else {
                alert.style.display = 'none';
            }
        }

        function filterThreads() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const stateFilter = document.getElementById('stateFilter').value;

            let filtered = allThreads.filter(t => {
                const nameMatch = (t.name || '').toLowerCase().includes(search);
                const stateMatch = stateFilter === 'all' || t.state === stateFilter;
                return nameMatch && stateMatch;
            });

            filtered.sort((a, b) => (b.name || '').localeCompare(a.name || ''));

            renderThreadList(filtered);
        }

        function renderThreadList(threads) {
            const container = document.getElementById('threadListContainer');
            document.getElementById('filteredCount').textContent = formatNumber(threads.length) + ' 条';

            if (threads.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info" style="margin: 20px;">
                        <i class="bi bi-info-circle"></i> 没有找到匹配的线程
                    </div>
                `;
                return;
            }

            let html = '<table class="table" style="margin: 0;">';
            html += `
                <thead style="position: sticky; top: 0; background: white; z-index: 1;">
                    <tr>
                        <th style="width: 50px;">ID</th>
                        <th style="width: 25%;">线程名</th>
                        <th style="width: 120px;">状态</th>
                        <th style="width: 100px;">优先级</th>
                        <th style="width: 150px;">锁</th>
                        <th style="width: 100px;">操作</th>
                    </tr>
                </thead>
                <tbody>
            `;

            threads.forEach(t => {
                const stateBadgeColor = stateColors[t.state] || '#6c757d';
                const hasStackTrace = t.stackTrace && t.stackTrace.length > 0;

                html += `
                    <tr>
                        <td><code>${t.id || '-'}</code></td>
                        <td>
                            <div style="font-family: monospace; font-size: 0.85rem;">
                                ${escapeHtml(t.name || 'Unknown')}
                            </div>
                        </td>
                        <td>
                            <span class="badge" style="background: ${stateBadgeColor}20; color: ${stateBadgeColor};">
                                ${t.state || '-'}
                            </span>
                        </td>
                        <td>${t.priority || '-'}</td>
                        <td>
                            ${t.lockName ? `<span class="badge badge-warning" title="${escapeHtml(t.lockName)}">持有锁</span>` : '-'}
                        </td>
                        <td>
                            ${hasStackTrace ? `
                                <button class="btn btn-outline btn-sm" onclick="showStackTrace('${escapeHtml(t.name)}', ${JSON.stringify(t.stackTrace).replace(/'/g, "\\'")})">
                                    <i class="bi bi-list-nested"></i> 堆栈
                                </button>
                            ` : '-'}
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function showStackTrace(name, stackTrace) {
            document.getElementById('stackTraceModalTitle').textContent = `堆栈追踪 - ${name}`;
            const content = stackTrace.join('\n');
            document.getElementById('stackTraceContent').textContent = content;

            const modal = new bootstrap.Modal(document.getElementById('stackTraceModal'));
            modal.show();
        }

        function showError(message) {
            const container = document.getElementById('threadListContainer');
            container.innerHTML = `
                <div class="alert alert-danger" style="margin: 20px;">
                    <i class="bi bi-exclamation-triangle"></i> ${escapeHtml(message)}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
