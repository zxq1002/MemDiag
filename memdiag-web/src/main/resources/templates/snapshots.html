<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName" th:text="${connectionId}">-</span>
                            </div>
                            <div class="ms-auto">
                                <button class="btn btn-primary" id="createSnapshotBtn">
                                    <i class="bi bi-camera"></i> 创建快照
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-images"></i> 快照列表</h3>
                        <button class="btn btn-outline btn-sm" id="refreshBtn">
                            <i class="bi bi-arrow-repeat"></i> 刷新
                        </button>
                    </div>
                    <div class="card-body" id="snapshotsContainer">
                        <div class="loading" style="padding: 40px;">
                            <div class="spinner"></div>
                            <span style="margin-left: 15px;">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:inline="javascript" th:fragment="scripts">
        // Get connectionId directly from template
        let connectionId = /*[[${connectionId}]]*/ null;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('refreshBtn').addEventListener('click', loadSnapshots);
            document.getElementById('createSnapshotBtn').addEventListener('click', createSnapshot);
            loadSnapshots();
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return new Date(dateStr).toLocaleString();
        }

        function loadSnapshots() {
            const container = document.getElementById('snapshotsContainer');
            container.innerHTML = `
                <div class="loading" style="padding: 40px;">
                    <div class="spinner"></div>
                    <span style="margin-left: 15px;">加载中...</span>
                </div>
            `;

            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/snapshots`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderSnapshots(data.data || []);
                    } else {
                        showError(data.error || '加载失败');
                    }
                })
                .catch(err => {
                    showError('加载失败: ' + err.message);
                });
        }

        function renderSnapshots(snapshots) {
            const container = document.getElementById('snapshotsContainer');

            if (!snapshots || snapshots.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info" style="margin: 0;">
                        <i class="bi bi-info-circle"></i> 暂无快照，点击"创建快照"按钮创建新快照
                    </div>
                `;
                return;
            }

            let html = '<table class="table" style="margin: 0;">';
            html += '<thead><tr><th>ID</th><th>名称</th><th>创建时间</th><th>大小</th><th>操作</th></tr></thead>';
            html += '<tbody>';
            snapshots.forEach(s => {
                html += `
                    <tr>
                        <td><code>${s.id || '-'}</code></td>
                        <td>${escapeHtml(s.name || 'Snapshot')}</td>
                        <td>${formatDate(s.createdAt)}</td>
                        <td>${formatBytes(s.size || 0)}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="loadSnapshot('${escapeHtml(s.id)}')">
                                <i class="bi bi-folder-open"></i> 加载
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="deleteSnapshot('${escapeHtml(s.id)}')" style="color: var(--danger-color);">
                                <i class="bi bi-trash"></i> 删除
                            </button>
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function createSnapshot() {
            const name = prompt('请输入快照名称:', 'snapshot-' + Date.now());
            if (!name) return;

            const btn = document.getElementById('createSnapshotBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin-right: 8px;"></span> 创建中...';

            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/snapshot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('快照创建成功!');
                    loadSnapshots();
                } else {
                    alert('创建失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(err => {
                alert('创建失败: ' + err.message);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-camera"></i> 创建快照';
            });
        }

        function loadSnapshot(id) {
            window.location.href = `/analysis/heap/${encodeURIComponent(connectionId)}?snapshot=${encodeURIComponent(id)}`;
        }

        function deleteSnapshot(id) {
            if (!confirm('确定要删除这个快照吗?')) return;

            fetch(`/api/v1/connections/${encodeURIComponent(connectionId)}/snapshots/${encodeURIComponent(id)}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    loadSnapshots();
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(err => {
                alert('删除失败: ' + err.message);
            });
        }

        function showError(message) {
            const container = document.getElementById('snapshotsContainer');
            container.innerHTML = `
                <div class="alert alert-danger" style="margin: 0;">
                    <i class="bi bi-exclamation-triangle"></i> ${escapeHtml(message)}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
