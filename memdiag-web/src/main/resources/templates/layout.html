<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'MemDiag - JVM 内存诊断工具'">MemDiag</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/memdiag.css}">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" th:fragment="sidebar">
            <div class="sidebar-header">
                <h1><i class="bi bi-diagram-3"></i> MemDiag</h1>
                <div class="subtitle">JVM 内存诊断工具</div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">主菜单</div>
                <a th:href="@{/}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                    <i class="bi bi-speedometer2"></i> 仪表盘
                </a>
                <a th:href="@{/connections}" class="nav-item" th:classappend="${activePage == 'connections'} ? 'active' : ''">
                    <i class="bi bi-plug"></i> 连接管理
                </a>

                <div class="nav-section">分析</div>
                <a th:href="@{/analysis/heap/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'heap'} ? 'active' : ''"
                   >
                    <i class="bi bi-stack"></i> 堆内存分析
                </a>
                <a th:href="@{/analysis/threads/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'threads'} ? 'active' : ''"
                   >
                    <i class="bi bi-collection"></i> 线程分析
                </a>
                <a th:href="@{/analysis/diagnose/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'diagnose'} ? 'active' : ''"
                   >
                    <i class="bi bi-stethoscope"></i> 诊断报告
                </a>
                <a th:href="@{/analysis/native/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'native'} ? 'active' : ''"
                   >
                    <i class="bi bi-cpu"></i> 堆外内存
                </a>

                <div class="nav-section">工具</div>
                <a th:href="@{/snapshots/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'snapshots'} ? 'active' : ''"
                   >
                    <i class="bi bi-camera"></i> 快照管理
                </a>
                <a th:href="@{/diff/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'diff'} ? 'active' : ''"
                   >
                    <i class="bi bi-arrow-left-right"></i> 对比分析
                </a>
                <a th:href="@{/report/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'report'} ? 'active' : ''"
                   >
                    <i class="bi bi-file-earmark-text"></i> 报告导出
                </a>

                <div class="nav-section">高级</div>
                <a th:href="@{/allocations/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'allocations'} ? 'active' : ''"
                   >
                    <i class="bi bi-graph-up-arrow"></i> 分配追踪
                </a>
                <a th:href="@{/methods/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'methods'} ? 'active' : ''"
                   >
                    <i class="bi bi-folder-symlink"></i> 方法监控
                </a>
                <a th:href="@{/gc-roots/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'gc-roots'} ? 'active' : ''"
                   >
                    <i class="bi bi-diagram-3"></i> GC Roots
                </a>
                <a th:href="@{/agent/{id}(id=${connectionId} ?: 'current')}"
                   class="nav-item" th:classappend="${activePage == 'agent'} ? 'active' : ''"
                   >
                    <i class="bi bi-gear"></i> Agent 管理
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-title">
                    <h2 th:text="${pageTitle} ?: '仪表盘'">仪表盘</h2>
                </div>
                <div class="header-actions d-flex align-items-center gap-3">
                    <!-- Connection Switcher - show on all pages after connections are loaded -->
                    <div class="dropdown" id="connectionSwitcher" style="display: none;">
                        <button class="btn btn-outline btn-sm dropdown-toggle" type="button" id="connectionDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-plug"></i> <span id="currentConnectionName">current</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="connectionList" aria-labelledby="connectionDropdown">
                            <li><span class="dropdown-item-text">加载中...</span></li>
                        </ul>
                    </div>
                    <button class="btn btn-outline btn-sm" id="helpBtn">
                        <i class="bi bi-question-circle"></i> 帮助
                    </button>
                </div>
            </header>

            <!-- Content -->
            <div class="content" th:fragment="content">
                <!-- Page content will be inserted here -->
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/memdiag.js}"></script>

    <!-- Global connection management -->
    <script th:inline="javascript">
        // Global connection ID from template (may be undefined on dashboard)
        let currentConnectionId = /*[[${connectionId}]]*/ null;
        let currentPage = /*[[${activePage}]]*/ 'dashboard';
        let availableConnections = {};

        // Map page names to URL patterns
        const pageUrlMap = {
            'dashboard': '/',
            'connections': '/connections',
            'heap': '/analysis/heap/{id}',
            'threads': '/analysis/threads/{id}',
            'diagnose': '/analysis/diagnose/{id}',
            'native': '/analysis/native/{id}',
            'snapshots': '/snapshots/{id}',
            'diff': '/diff/{id}',
            'report': '/report/{id}',
            'allocations': '/allocations/{id}',
            'methods': '/methods/{id}',
            'gc-roots': '/gc-roots/{id}',
            'agent': '/agent/{id}'
        };

        // Load connections and populate dropdown
        function loadConnections() {
            fetch('/api/v1/connections')
                .then(response => response.json())
                .then(data => {
                    availableConnections = data;

                    // Show connection switcher
                    const switcher = document.getElementById('connectionSwitcher');
                    if (switcher) {
                        switcher.style.display = 'block';
                    }

                    // If no currentConnectionId from template, pick first available
                    if (!currentConnectionId && Object.keys(data).length > 0) {
                        currentConnectionId = Object.keys(data)[0];
                    }

                    // Update current connection name display (header dropdown)
                    const connNameEl = document.getElementById('currentConnectionName');
                    if (connNameEl && currentConnectionId) {
                        connNameEl.textContent = currentConnectionId;
                    }

                    // Update connection name display in analysis pages (heap, threads, diagnose, etc.)
                    const pageConnNameEl = document.getElementById('connectionName');
                    if (pageConnNameEl && currentConnectionId) {
                        pageConnNameEl.textContent = currentConnectionId;
                    }

                    // Populate dropdown
                    const dropdown = document.getElementById('connectionList');
                    if (!dropdown) return;

                    let html = '';
                    for (const [id, status] of Object.entries(data)) {
                        const isActive = id === currentConnectionId;
                        const isOnline = status && status.includes('connected');
                        const badgeClass = isOnline ? 'bg-success' : 'bg-secondary';
                        html += `
                            <li>
                                <a class="dropdown-item ${isActive ? 'active' : ''}" href="#" onclick="switchConnection('${id}'); return false;">
                                    <span class="badge ${badgeClass}" style="margin-right: 8px; width: 8px; height: 8px; display: inline-block; border-radius: 50%;"></span>
                                    ${id}
                                    ${isActive ? '<i class="bi bi-check" style="margin-left: 8px;"></i>' : ''}
                                </a>
                            </li>
                        `;
                    }
                    dropdown.innerHTML = html;
                })
                .catch(err => console.error('Failed to load connections:', err));
        }

        // Switch to a different connection
        function switchConnection(newConnectionId) {
            if (newConnectionId === currentConnectionId) return;

            currentConnectionId = newConnectionId;

            // Get the URL pattern for current page
            let urlPattern = pageUrlMap[currentPage];
            if (!urlPattern) {
                urlPattern = '/';
            }

            // If the pattern has {id} placeholder, replace it
            // If not (like dashboard), just go to the first analysis page for that connection
            let newUrl;
            if (urlPattern.includes('{id}')) {
                newUrl = urlPattern.replace('{id}', encodeURIComponent(newConnectionId));
            } else {
                // For dashboard and connections page, go to heap analysis by default
                newUrl = '/analysis/heap/' + encodeURIComponent(newConnectionId);
            }

            // Navigate to new URL
            window.location.href = newUrl;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadConnections();
        });
    </script>

    <!-- Page-specific scripts -->
    <th:block th:fragment="scripts"></th:block>
</body>
</html>
