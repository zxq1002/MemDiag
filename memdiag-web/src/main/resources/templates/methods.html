<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName" th:text="${connectionId}">-</span>
                            </div>
                            <div class="ms-auto">
                                <button class="btn btn-primary" id="refreshBtn">
                                    <i class="bi bi-arrow-repeat"></i> 刷新
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i>
                    方法监控功能需要 Agent 字节码插桩支持。
                </div>

                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="bi bi-folder-symlink"></i>
                        </div>
                        <div class="stat-info">
                            <h4>监控方法数</h4>
                            <div class="value" id="methodCount">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="bi bi-arrow-repeat"></i>
                        </div>
                        <div class="stat-info">
                            <h4>总调用次数</h4>
                            <div class="value" id="totalInvocations">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                        <div class="stat-info">
                            <h4>平均耗时</h4>
                            <div class="value" id="avgDuration">-</div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><i class="bi bi-bar-chart"></i> 慢方法 Top 10</h3>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" style="height: 250px;">
                            <canvas id="slowMethodsChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-list-ul"></i> 方法统计</h3>
                        <select class="form-select" style="width: auto;" id="sortBy">
                            <option value="duration">按耗时</option>
                            <option value="count">按调用次数</option>
                        </select>
                    </div>
                    <div class="card-body" id="methodsContainer">
                        <div class="alert alert-info" style="margin: 0;">
                            <i class="bi bi-info-circle"></i> 请先通过 Agent 模式连接目标 JVM
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:inline="javascript" th:fragment="scripts">
        // Get connectionId directly from template
        let connectionId = /*[[${connectionId}]]*/ null;
        let slowMethodsChart = null;
        let allMethods = [];

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('refreshBtn').addEventListener('click', loadMethods);
            document.getElementById('sortBy').addEventListener('change', renderMethods);
            loadMethods();
        });

        function formatMs(ms) {
            if (ms < 1) return (ms * 1000).toFixed(1) + ' µs';
            if (ms < 1000) return ms.toFixed(2) + ' ms';
            return (ms / 1000).toFixed(2) + ' s';
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function loadMethods() {
            fetch('/api/v1/connections/' + encodeURIComponent(connectionId) + '/methods/stats')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        allMethods = data.data.methods || [];
                        renderStats(data.data);
                        renderSlowMethods(allMethods);
                        renderMethods();
                    }
                })
                .catch(err => {
                    console.error('Failed to load methods:', err);
                });
        }

        function renderStats(data) {
            document.getElementById('methodCount').textContent = formatNumber((data.methods || []).length);
            const total = (data.methods || []).reduce((sum, m) => sum + (m.count || 0), 0);
            document.getElementById('totalInvocations').textContent = formatNumber(total);
            const avg = total > 0 ? (data.methods || []).reduce((sum, m) => sum + (m.avgDuration || 0), 0) / (data.methods || []).length : 0;
            document.getElementById('avgDuration').textContent = formatMs(avg);
        }

        function renderSlowMethods(methods) {
            const sorted = [...methods].sort((a, b) => (b.avgDuration || 0) - (a.avgDuration || 0)).slice(0, 10);
            const ctx = document.getElementById('slowMethodsChart').getContext('2d');
            if (slowMethodsChart) slowMethodsChart.destroy();

            slowMethodsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(m => {
                        const name = m.methodName || 'Unknown';
                        const short = name.substring(name.lastIndexOf('.') + 1);
                        return short.length > 20 ? short.substring(0, 17) + '...' : short;
                    }),
                    datasets: [{
                        label: '平均耗时',
                        data: sorted.map(m => m.avgDuration || 0),
                        backgroundColor: '#fd7e14',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: { callback: v => formatMs(v) }
                        }
                    }
                }
            });
        }

        function renderMethods() {
            const sortBy = document.getElementById('sortBy').value;
            const container = document.getElementById('methodsContainer');

            let sorted = [...allMethods];
            if (sortBy === 'duration') {
                sorted.sort((a, b) => (b.avgDuration || 0) - (a.avgDuration || 0));
            } else {
                sorted.sort((a, b) => (b.count || 0) - (a.count || 0));
            }

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info" style="margin: 0;">
                        <i class="bi bi-info-circle"></i> 暂无方法统计数据
                    </div>
                `;
                return;
            }

            let html = '<table class="table" style="margin: 0;">';
            html += '<thead><tr><th>方法</th><th>调用次数</th><th>平均耗时</th><th>总耗时</th><th>最大耗时</th></tr></thead>';
            html += '<tbody>';

            sorted.forEach(m => {
                html += '<tr>';
                html += '<td><code style="font-size: 0.8rem;">' + escapeHtml(m.methodName || 'Unknown') + '</code></td>';
                html += '<td>' + formatNumber(m.count || 0) + '</td>';
                html += '<td>' + formatMs(m.avgDuration || 0) + '</td>';
                html += '<td>' + formatMs((m.avgDuration || 0) * (m.count || 0)) + '</td>';
                html += '<td>' + formatMs(m.maxDuration || 0) + '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
