<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-info-circle" style="font-size: 1.5rem; color: var(--info-color);"></i>
                            <div>
                                <strong>连接:</strong> <span id="connectionName" th:text="${connectionId}">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><i class="bi bi-file-earmark-text"></i> 报告选项</h3>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">报告格式</label>
                                <select class="form-select" id="formatSelect">
                                    <option value="html">HTML</option>
                                    <option value="json">JSON</option>
                                    <option value="text">Plain Text</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">包含内容</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeHeap" checked>
                                    <label class="form-check-label" for="includeHeap">堆内存分析</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeThreads" checked>
                                    <label class="form-check-label" for="includeThreads">线程分析</label>
                                </div>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button class="btn btn-primary w-100" id="generateBtn">
                                    <i class="bi bi-download"></i> 生成报告
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" id="previewCard" style="display: none;">
                    <div class="card-header">
                        <h3><i class="bi bi-eye"></i> 报告预览</h3>
                    </div>
                    <div class="card-body" id="previewContainer">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:inline="javascript" th:fragment="scripts">
        // Get connectionId directly from template
        let connectionId = /*[[${connectionId}]]*/ null;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('generateBtn').addEventListener('click', generateReport);
        });

        function generateReport() {
            const format = document.getElementById('formatSelect').value;
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const filename = 'memdiag-report-' + connectionId + '-' + timestamp + '.' + format;

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin-right: 8px;"></span> 生成中...';

            Promise.all([
                fetch('/api/v1/connections/' + encodeURIComponent(connectionId) + '/histogram').then(r => r.json()),
                fetch('/api/v1/connections/' + encodeURIComponent(connectionId) + '/threads').then(r => r.json()),
                fetch('/api/v1/connections/' + encodeURIComponent(connectionId) + '/diagnose').then(r => r.json())
            ])
            .then(([histogram, threads, diagnose]) => {
                const report = {
                    connectionId: connectionId,
                    generatedAt: new Date().toISOString(),
                    heap: histogram.success ? histogram.data : null,
                    threads: threads.success ? threads.data : null,
                    diagnosis: diagnose.success ? diagnose.data : null
                };

                let content, mimeType;
                if (format === 'json') {
                    content = JSON.stringify(report, null, 2);
                    mimeType = 'application/json';
                } else if (format === 'html') {
                    content = generateHtmlReport(report);
                    mimeType = 'text/html';
                } else {
                    content = generateTextReport(report);
                    mimeType = 'text/plain';
                }

                if (format === 'html' || format === 'text') {
                    document.getElementById('previewCard').style.display = 'block';
                    if (format === 'html') {
                        document.getElementById('previewContainer').innerHTML = '<iframe style="width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 8px;" srcdoc="' + escapeHtml(content) + '"></iframe>';
                    } else {
                        document.getElementById('previewContainer').innerHTML = '<pre style="background: #f8f9fa; padding: 15px; border-radius: 8px; max-height: 500px; overflow: auto;">' + escapeHtml(content) + '</pre>';
                    }
                }

                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            })
            .catch(err => {
                alert('生成报告失败: ' + err.message);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-download"></i> 生成报告';
            });
        }

        function generateHtmlReport(report) {
            var html = '<!DOCTYPE html>\n' +
'<html>\n' +
'<head>\n' +
'    <meta charset="UTF-8">\n' +
'    <title>MemDiag Report - ' + report.connectionId + '</title>\n' +
'    <style>\n' +
'        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px 20px; }\n' +
'        h1 { border-bottom: 2px solid #0d6efd; padding-bottom: 10px; }\n' +
'        .section { margin: 30px 0; }\n' +
'        table { width: 100%; border-collapse: collapse; }\n' +
'        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }\n' +
'        th { background: #f8f9fa; }\n' +
'        .meta { color: #666; font-size: 0.9rem; margin-top: 20px; }\n' +
'    </style>\n' +
'</head>\n' +
'<body>\n' +
'    <h1>MemDiag 诊断报告</h1>\n' +
'    <p><strong>连接:</strong> ' + report.connectionId + '</p>\n' +
'    <p><strong>生成时间:</strong> ' + new Date(report.generatedAt).toLocaleString() + '</p>\n' +
'\n' +
'    <div class="section">\n' +
'        <h2>诊断结果</h2>\n';
            if (report.diagnosis) {
                html += '            <p>问题数: ' + (report.diagnosis.issues || []).length + '</p>\n';
                (report.diagnosis.issues || []).forEach(function(i) {
                    html += '            <div style="padding: 15px; margin: 10px 0; background: #fff5f5; border-left: 4px solid #dc3545; border-radius: 4px;">\n' +
'                    <strong>' + i.title + '</strong>\n' +
'                    <p>' + i.description + '</p>\n' +
'                </div>\n';
                });
            } else {
                html += '        <p>暂无诊断数据</p>\n';
            }
            html += '    </div>\n' +
'\n' +
'    <div class="section">\n' +
'        <h2>堆内存概览</h2>\n';
            if (report.heap) {
                html += '            <p>类数量: ' + (report.heap.classes || []).length + '</p>\n';
            } else {
                html += '        <p>暂无堆数据</p>\n';
            }
            html += '    </div>\n' +
'\n' +
'    <div class="section">\n' +
'        <h2>线程概览</h2>\n';
            if (report.threads) {
                html += '            <p>线程数: ' + (report.threads.threads || []).length + '</p>\n';
            } else {
                html += '        <p>暂无线程数据</p>\n';
            }
            html += '    </div>\n' +
'\n' +
'    <div class="meta">由 MemDiag 生成</div>\n' +
'</body>\n' +
'</html>';
            return html;
        }

        function generateTextReport(report) {
            let text = 'MemDiag 诊断报告\n';
            text += '连接: ' + report.connectionId + '\n';
            text += '生成时间: ' + new Date(report.generatedAt).toLocaleString() + '\n';
            text += '============================================================\n\n';

            if (report.diagnosis) {
                text += '诊断结果:\n';
                (report.diagnosis.issues || []).forEach(function(i) {
                    text += '  [' + i.severity + '] ' + i.title + '\n';
                    text += '    ' + i.description + '\n';
                    if (i.recommendation) text += '    建议: ' + i.recommendation + '\n';
                    text += '\n';
                });
            }

            if (report.heap) {
                text += '堆内存: ' + (report.heap.classes || []).length + ' 个类\n\n';
            }

            if (report.threads) {
                text += '线程: ' + (report.threads.threads || []).length + ' 个线程\n\n';
            }

            return text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
