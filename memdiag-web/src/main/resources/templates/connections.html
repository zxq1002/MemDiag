<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head"></head>
<body>
    <div class="wrapper">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="main-content">
            <header th:replace="layout :: header"></header>
            <div class="content">
                <!-- Create Connection Form -->
                <div class="card" style="margin-bottom: 30px;">
                    <div class="card-header">
                        <h3><i class="bi bi-plus-circle"></i> 创建新连接</h3>
                    </div>
                    <div class="card-body">
                        <form id="createConnectionForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">连接名称 *</label>
                                    <input type="text" class="form-control" id="connName"
                                           placeholder="例如：MyProductionApp" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">连接类型</label>
                                    <select class="form-select" id="connType">
                                        <option value="auto">自动检测</option>
                                        <option value="jmx">JMX 模式（PID）</option>
                                        <option value="agent">Agent 模式（host:port）</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">目标 *</label>
                                    <input type="text" class="form-control" id="connTarget"
                                           placeholder="PID 或 host:port" required>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-plug"></i> 创建连接
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Connections List -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-list-check"></i> 所有连接</h3>
                        <button class="btn btn-outline btn-sm" id="refreshBtn">
                            <i class="bi bi-arrow-repeat"></i> 刷新
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="connectionsList">
                            <!-- Connections will be loaded here -->
                            <div class="loading">
                                <div class="spinner"></div>
                                <span style="margin-left: 15px;">加载连接列表...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/memdiag.js}"></script>
    <script th:fragment="scripts">
        // Connections page JavaScript
        const connectionsApi = '/api/v1/connections';

        // Load connections on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadConnections();
        });

        // Refresh button
        document.getElementById('refreshBtn')?.addEventListener('click', loadConnections);

        // Create connection form
        document.getElementById('createConnectionForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            createConnection();
        });

        function loadConnections() {
            const container = document.getElementById('connectionsList');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span style="margin-left: 15px;">加载连接列表...</span>
                </div>
            `;

            fetch(connectionsApi)
                .then(response => response.json())
                .then(connections => {
                    renderConnections(connections);
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                            加载失败：${err.message}
                        </div>
                    `;
                });
        }

        function renderConnections(connections) {
            const container = document.getElementById('connectionsList');

            if (!connections || Object.keys(connections).length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        暂无连接，请先创建一个连接。
                    </div>
                `;
                return;
            }

            let html = '<div class="connection-list">';

            for (const [id, status] of Object.entries(connections)) {
                const isOnline = status && status.includes('connected');
                const type = status && status.includes('agent') ? 'AGENT' : 'JMX';

                html += `
                    <div class="connection-card">
                        <div class="connection-info">
                            <div class="connection-status ${isOnline ? 'online' : 'offline'}"></div>
                            <div class="connection-details">
                                <h4>${escapeHtml(id)}</h4>
                                <div class="type">
                                    <span class="badge ${type === 'AGENT' ? 'badge-info' : 'badge-secondary'}">${type}</span>
                                    <span class="badge ${isOnline ? 'badge-success' : 'badge-secondary'}">
                                        ${isOnline ? '在线' : '离线'}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="connection-actions">
                            ${isOnline ? `
                                <a href="/analysis/heap/${escapeHtml(id)}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-graph-up"></i> 分析
                                </a>
                            ` : ''}
                            <button class="btn btn-outline btn-sm" onclick="deleteConnection('${escapeHtml(id)}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function createConnection() {
            const name = document.getElementById('connName').value.trim();
            const target = document.getElementById('connTarget').value.trim();

            if (!name || !target) {
                alert('请填写连接名称和目标');
                return;
            }

            fetch(`${connectionsApi}/${encodeURIComponent(name)}?target=${encodeURIComponent(target)}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'connected') {
                    alert('连接创建成功！');
                    loadConnections();
                    document.getElementById('createConnectionForm').reset();
                } else {
                    alert('创建失败：' + (data.error || '未知错误'));
                }
            })
            .catch(err => {
                alert('创建失败：' + err.message);
            });
        }

        function deleteConnection(id) {
            if (!confirm(`确定要删除连接 "${id}" 吗？`)) {
                return;
            }

            fetch(`${connectionsApi}/${encodeURIComponent(id)}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                alert('连接已删除');
                loadConnections();
            })
            .catch(err => {
                alert('删除失败：' + err.message);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
