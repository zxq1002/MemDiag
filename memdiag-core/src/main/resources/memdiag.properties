# MemDiag Configuration
# Sampling rate for native memory allocation tracking (number of events to buffer)
memdiag.native.sampling-rate=100000

# Timeout for JMX heap histogram analysis in milliseconds
memdiag.jmx.heap-histogram-timeout-ms=500

# Maximum safe point duration in milliseconds
memdiag.jmx.max-safe-point-time-ms=500

# Memory limit for analysis operations (0 = use 80% of max heap)
memdiag.analysis.memory-limit-bytes=0
